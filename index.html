<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🗑️ The Useless Waste Basket — Sorting Game</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗑️</text></svg>" />
 <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>🗑️ The Useless Waste Basket</h1>
      <p>It finally got a job. Judging your waste.</p>
    </header>

    <div class="topbar">
      <div class="card aura-card">
        <div class="label">✨ Aura</div>
        <div class="aura-value" id="auraValue">0</div>
      </div>
      <div class="card round-card">
        <div class="label">Round</div>
        <div class="round-line" id="roundLine">1 / 10</div>
        <div class="dots" id="dots"></div>
      </div>
    </div>

    <section class="card basket-card">
      <div class="basket-stage">
        <div class="badge" id="badge"></div>
        <div class="basket" id="basket">
          <div class="face">👀</div>
          <div class="bin">🗑️</div>
        </div>
        <p class="basket-text">Is this waste?</p>
        <div class="item-card" id="item">
          <div class="item-emoji" id="itemEmoji"></div>
          <div class="item-name" id="itemName"></div>
          <div class="item-hint">Is as it seems? Judge it.</div>
        </div>
      </div>

      <div class="actions">
        <button class="put-btn" id="putBtn">🗑️ PUT IN BASKET</button>
        <button class="keep-btn" id="keepBtn">❌ DON'T PUT</button>
      </div>
    </section>

    <section class="feedback" aria-label="Result">
      <p class="result-msg hidden" id="resultMsg"></p>
      <p class="score-delta hidden" id="scoreDelta"></p>
    </section>
  </main>

  <footer>
    <span class="brand">🗑️ The Useless Waste Basket™</span>
    <em>"Because accepting waste is overrated."</em>
  </footer>

  <div class="overlay hidden" id="overlay">
    <div class="overlay-card">
      <h2>⭐ Final Aura Score</h2>
      <div class="final-score" id="finalScore">0</div>
      <p class="final-msg" id="finalMsg"></p>
      <button class="put-btn" id="playAgainBtn">↻ Play Again</button>
    </div>
  </div>

   <script src="script.js"></script>
</body>
</html>
